$kind: http-request
url: "{{baseUrl}}/buku?sort=harga&order=desc&limit=2"
method: GET
queryParams:
  sort: harga
  order: desc
  limit: "2"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('limit dipatuhi', () => {
        pm.expect(pm.response.json().data.length).to.eql(2);
      });
      pm.test('urut menurun', () => {
        const d = pm.response.json().data;
        pm.expect(d[0].harga).to.be.at.least(d[1].harga);
      });
    language: text/javascript
order: 4000
