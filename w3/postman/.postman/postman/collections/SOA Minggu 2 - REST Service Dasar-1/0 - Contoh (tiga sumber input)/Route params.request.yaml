$kind: http-request
description: |-
  **GET** `/api/v1/contoh/jojo/umur/40/jk`

  **Path Param:** `nama` = `jojo`, `umur` = `40`, `jk` = *(tidak diisi — parameter `:jk?` ini opsional)*.

  Tujuan: parameter path yang diakhiri `?` (`:jk?`) boleh tidak ada di URL. Response `jk` akan berisi nilai default `"Tidak Tahu"`.
url: "{{baseUrl}}/contoh/jojo/umur/40/jk"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('default jk terisi', () => {
        pm.expect(pm.response.json().jk).to.eql('Tidak Tahu');
      });
    language: text/javascript
order: 2000
