$kind: http-request
name: Body kosong -> 400
description: |-
  **POST** `/api/v1/contoh`

  **Body:** sengaja KOSONG (tab Body pada request ini tidak diisi).

  Tujuan: controller menolak body kosong dengan `400`, dan pesan errornya memandu memeriksa dua penyebab paling umum — lihat `src/controllers/contoh.js`.
url: "{{baseUrl}}/contoh"
method: POST
scripts:
  - type: afterResponse
    code: pm.test('body kosong ditolak', () => pm.response.to.have.status(400));
    language: text/javascript
order: 4000
