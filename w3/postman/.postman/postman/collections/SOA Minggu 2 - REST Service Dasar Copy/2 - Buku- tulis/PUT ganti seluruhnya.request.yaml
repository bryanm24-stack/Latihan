$kind: http-request
description: |-
  **PUT** `/api/v1/buku/{{bukuId}}`

  **Path Param:** `bukuId` = *(dari "Tambah buku")*.

  **Body — SEMUA field wajib dikirim, PUT = ganti total:**
  ```json
  {
    "judul": "Dune Messiah",
    "penulis": "Frank Herbert",
    "tahun_terbit": 1969,
    "harga": 160000,
    "stok": 3,
    "kategori": "novel"
  }
  ```

  Ekspektasi: `200`, `judul` di response sudah berganti. Field yang tidak dikirim di body PUT akan HILANG/ternilai ulang — beda dengan PATCH di bawah.
url: "{{baseUrl}}/buku/{{bukuId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "judul": "Dune Messiah",
      "penulis": "Frank Herbert",
      "tahun_terbit": 1969,
      "harga": 160000,
      "stok": 3,
      "kategori": "novel"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('judul terganti', () => {
        pm.expect(pm.response.json().judul).to.eql('Dune Messiah');
      });
    language: text/javascript
order: 5000
