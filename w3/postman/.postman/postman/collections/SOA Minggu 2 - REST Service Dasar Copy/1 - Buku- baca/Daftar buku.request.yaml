$kind: http-request
description: |-
  **GET** `/api/v1/buku`

  **Query / Path Param:** tidak ada — ini bentuk PALING DASAR, tanpa filter apa pun.

  Ekspektasi: `200`, body berisi `{ total, limit, offset, data: [...] }`. `data` berisi field RINGKAS saja (id, judul, penulis, harga, stok) — bukan objek lengkap dengan `karakter`.
url: "{{baseUrl}}/buku"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('ada total dan data', () => {
        const b = pm.response.json();
        pm.expect(b).to.have.property('total');
        pm.expect(b.data).to.be.an('array');
      });
    language: text/javascript
order: 1000
