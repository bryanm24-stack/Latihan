$kind: http-request
name: Karakter tidak ada -> 404
description: Pesan errornya harus BEDA dengan 'buku tidak ditemukan'.
url: "{{baseUrl}}/buku/1/karakter/99"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('404', () => pm.response.to.have.status(404));
      pm.test('pesan spesifik karakter', () => {
        pm.expect(pm.response.json().msg.toLowerCase()).to.include('karakter');
      });
    language: text/javascript
order: 10000
