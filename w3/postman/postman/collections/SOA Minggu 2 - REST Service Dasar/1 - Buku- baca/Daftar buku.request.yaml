$kind: http-request
url: "{{baseUrl}}/buku"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('ada total dan data', () => {
        const b = pm.response.json();
        pm.expect(b).to.have.property('total');
        pm.expect(b.data).to.be.an('array');
      });
    language: text/javascript
order: 1000
